# Profil de TEST - baza de date H2 in-memory (separata de MySQL-ul de dezvoltare)
# MODE=MySQL permite sintaxa MySQL (ex. identificatorii cu backtick `groups`)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Valori dummy pentru beans care au nevoie de ele la pornirea contextului
minio.url=http://localhost:9000
minio.access.name=test
minio.access.secret=test12345
app.jwt.secret=testSecretKeyThatIsAtLeast32CharactersLong1234567890

admin.username=admin
admin.password=admin123
admin.email=admin@test.com

logging.level.root=warn
